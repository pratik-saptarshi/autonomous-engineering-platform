  - message:assistant-msg-65d97421-322d-44c6-a795-83900881446f
  measurement:
    proxy_metric_id: blocked_skill_rework_rate
    success_criterion: Zero scan-blocked third-party skills modified and rescanned only to fail the gate again, and zero inferred-cause modifications, in the 30-day window. A window with no blocked-skill ingestions is inconclusive, not success.
    window_days: 30
  needs_review: false
  rationale: 'When the SkillSpector gate blocked the third-party archify skill, the agent inferred the trigger from the skill''s file layout (the skill''s own update machinery) and modified the skill on that inference at the user''s direction, without ever reading the scanner''s findings. The modified skill failed the gate again, and the agent later admitted it had never seen archify''s original findings. A skill search confirms no existing skill covers the pre-ingestion gate verdict protocol (writing_skills covers authoring, not gate triage), so this is a distinct reusable method: run the fail-closed gate, read the full JSON findings on a block, and decide the verdict from the flagged lines in context rather than from layout inference. Chunk 2''s tool/cron failures carry only generic terminal details with no error text, so they ground no finding; the cross-session auto-merge arming is already handled by the standing disarm-and-report duty, which a new skill on this side would not change, so neither yields a proposal.'
