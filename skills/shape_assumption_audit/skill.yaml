name: shape_assumption_audit
title: Shape Assumption Audit
description: Surface defects hidden by linear, quiescent, single handle and valid input fixture shapes by auditing the implicit shape assumptions of a stateful system before merge, when internal reviews have passed but the system handles graphs, concurrency, storage or untrusted input.
category: Work and knowledge
include_in_prompt: false
