name: "plan-review-integrator"
title: "Plan-Review Integrator"
description: "Integrate structured review panel findings into an implementation plan document. Takes output from overseer (or any structured review with severity-rated findings), cross-references each finding against the plan, classifies it into an action category, applies concrete edits, and produces a traceability summary. Trigger when the user asks to update a plan with review findings, incorporate review feedback into a plan, or reconcile review output against the plan. Does NOT trigger for running a review panel, writing a plan from scratch, or general code review."
category: "Work and knowledge"
