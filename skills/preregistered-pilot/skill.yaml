name: "preregistered-pilot"
title: "Pre-Registered Pilot"
description: "Run a tool or capability pilot whose verdict cannot be negotiated after the fact: select the subject from a classified census of real work, freeze the pre-registration before building, register every trusted boundary before relying on it, run in owner-gated stages, and judge strictly against the frozen criteria. Use when a pilot's result will feed an adoption decision, or when a favoured candidate risks being pre-committed before the evidence exists."
