# Gitleaks config for autonomous-engineering-platform.
#
# The vendored ESF tree contains synthetic secret fixtures in its redaction
# unit tests (sequential fake ghp_ material, documented in
# reference/esf/PROVENANCE.md). Allowlist them here so the byte-identical
# vendor tree is never touched for lint reasons.
#
# The vendored NeuroStrata tree has the same pattern: its secret-redaction
# test suites (src/secrets.rs, src/buffer.rs, both #[cfg(test)]) carry
# sequential fake ghp_ material and AWS documentation example keys,
# documented in reference/neurostrata/PROVENANCE.md.
[extend]
useDefault = true
[allowlist]
description = "Synthetic fixtures in vendored redaction tests (ESF, NeuroStrata)"
paths = ['''reference/esf/internal/factory/redact_test.go''', '''reference/esf/internal/factory/evidence_test.go''',
'''reference/neurostrata/src/secrets.rs''',
'''reference/neurostrata/src/buffer.rs''']
