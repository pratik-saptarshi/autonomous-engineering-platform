# markdownlint baseline for autonomous-engineering-platform.
#
# Every rule is enabled except the five below, each of which the corpus
# satisfies only by violating the rule's intent. Run:
#   npx --yes markdownlint-cli2@0.24.0 "**/*.md" "!reference/**"
#
# reference/** is excluded at the gate, not here: those trees are
# byte-pinned vendored snapshots (see .github/vendor-*.sha256) and must
# never be edited in place.

# Line length is unrestricted: prose and tables carry long, unbreakable lines.
MD013: false

# Inline HTML is deliberate: <br/> in tables, <details> blocks, and
# angle-bracket placeholders such as <bundle> that must render as text.
MD033: false

# Bold lead-ins (**Watch for:** ...) are labels in skill docs, not headings.
MD036: false

# Imported review records open with a status line ("Status: resolved"),
# not an H1; their shape is fixed by the review workflow that produced them.
MD041: false

# Repeated headings are legitimate under different parents. The few
# duplicate siblings in this corpus are illustrative before/after examples,
# suppressed inline with markdownlint-disable-next-line at the example.
MD024: { siblings_only: true }

# Procedures are numbered sequences (1., 2., 3.), not all-ones lists.
MD029: { style: "ordered" }

# Tables use the compact pipe style already used throughout the corpus.
MD060: { style: "compact" }
