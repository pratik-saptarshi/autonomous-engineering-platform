name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli2@0.24.0 "**/*.md" "!reference/esf/**/*.md" "!reference/neurostrata/**/*.md" "!reference/neurostrata-ops/**/*.md" "!reference/harness2/**/*.md" "!reference/security-audit-skill/**/*.md" "!reference/ub-mode/**/*.md" "!reference/grim-prompter/**/*.md" "!reference/docs-mcp-server/**/*.md" "!reference/humanizer/**/*.md" "!reference/elephant-goldfish-model/**/*.md" "!skills/archify/**/*.md" "!skills/diagnosing-superpowers/**/*.md" "!skills/neurogenesis/**/*.md" "!skills/overseer/**/*.md" "!skills/retro/**/*.md" "!skills/egm-bootstrap/**/*.md" "!skills/egm-brainstorm/**/*.md" "!skills/egm-draft/**/*.md" "!skills/egm-drift-report/**/*.md" "!skills/egm-resolve/**/*.md" "!skills/egm-review/**/*.md" "!skills/egm-review-loop/**/*.md" "!docs/egm-adoption/**/*.md"

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
          shellcheck scripts/*.sh
          test -z "$(shfmt -d -i 2 scripts/*.sh)"

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: bash scripts/lane-coord.sh --self-test
      - run: bash scripts/boot-gate.sh --self-test --offline
      - run: bash scripts/tests/test_watchdog.sh

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - run: test -z "$(gofmt -l reference/esf)"
      - run: cd reference/esf && go vet ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xz -C /tmp -f /tmp/gitleaks.tar.gz
      - name: Scan working tree for secrets
        # Direct run (not gitleaks-action): the action's PR range logic breaks
        # on merge commits (0-byte partial scan). A working-tree scan is
        # deterministic. .gitleaks.toml allowlists the known synthetic fixtures.
        run: /tmp/gitleaks detect --source . --verbose --exit-code 1

  vendor-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          cd reference/esf
          sha256sum -c ../../.github/vendor-esf.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-esf.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/neurostrata
          sha256sum -c ../../.github/vendor-neurostrata.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-neurostrata.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/neurostrata-ops
          sha256sum -c ../../.github/vendor-neurostrata-ops.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-neurostrata-ops.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/harness2
          sha256sum -c ../../.github/vendor-harness2.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-harness2.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/security-audit-skill
          sha256sum -c ../../.github/vendor-security-audit-skill.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-security-audit-skill.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/ub-mode
          sha256sum -c ../../.github/vendor-ub-mode.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-ub-mode.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/grim-prompter
          sha256sum -c ../../.github/vendor-grim-prompter.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-grim-prompter.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/docs-mcp-server
          sha256sum -c ../../.github/vendor-docs-mcp-server.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-docs-mcp-server.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/humanizer
          sha256sum -c ../../.github/vendor-humanizer.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-humanizer.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/craft-anything
          sha256sum -c ../../.github/vendor-craft-anything.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-craft-anything.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - run: |
          cd reference/elephant-goldfish-model
          sha256sum -c ../../.github/vendor-elephant-goldfish-model.sha256
          comm -23 <(find . -type f | sort) <(cut -d' ' -f3- ../../.github/vendor-elephant-goldfish-model.sha256 | sed 's|^\./|./|' | sort) | grep -q . && { echo "ERROR: unlisted files"; exit 1; } || true
          find . -type l | while read -r link; do test -e "$link" || { echo "ERROR: broken symlink $link"; exit 1; }; done
      - name: Run vendored security-audit validator suites
        run: |
          node --test reference/security-audit-skill/skills/security-audit/validate-findings.test.cjs
          node --test reference/security-audit-skill/skills/security-audit/validate-coverage-ledger.test.cjs

  # Bounded claim: this gate proves the repo skills/ tree equals the manifest
  # generated from the repo tree immediately after the last sync copied from
  # live -- a consistency claim about the sync's own output, never a freshness
  # claim against the live tree (CI cannot see live).
  skills-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check_skills_manifest.py --root skills --check

  # Bounded claim: this gate proves no file under skills/ contains the
  # craft-anything runtime's artifact names, a command-position or
  # registration-form invocation of it, or a non-negated imperative
  # instruction to invoke it. The adoption (plan v2.1, Phase 3) took the
  # protocol, not the engine; this recurring check replaces the one-time
  # grep and is lifted only as part of an authorized runtime plan.
  skills-routing-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/check_skills_phantom_capability.py --root skills
