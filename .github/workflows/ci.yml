name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # reference/** is excluded because those trees are byte-pinned vendored
      # snapshots (see .github/vendor-*.sha256): lint must never force an
      # edit there. Everything else in the repo is linted.
      - run: npx --yes markdownlint-cli2@0.24.0 "**/*.md" "!reference/**"
      - name: Design invariants
        run: |
          python3 scripts/check_design_invariants.py --self-test
          python3 scripts/check_design_invariants.py --check

  shell-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      - name: Install shellcheck (pinned, checksum-verified)
        # Pinned release tarball instead of the runner's apt package: the
        # apt install started failing on the Ubuntu 26.04 image, and a
        # floating version would let a lint verdict change with the image.
        run: |
          curl -fsSL --connect-timeout 15 --max-time 180 --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJ -C /tmp -f /tmp/shellcheck.tar.xz
          sudo install -m 0755 /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
          # skills/wizard/template.sh is an executable skill asset (the library
          # every generated wizard copies), so it is linted like scripts/.
          shellcheck scripts/*.sh ops/bin/*.sh tools/ghg/bin/ghg skills/wizard/template.sh
          test -z "$(shfmt -d -i 2 scripts/*.sh ops/bin/*.sh tools/ghg/bin/ghg skills/wizard/template.sh)"

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: ghg suite (stub gh, no live GitHub; executed-test count asserted)
        # unittest discovery treats a test file that is deleted or fails to
        # load as fewer tests, not a failure, and a skip counts as a pass.
        # The 14 OpenTelemetry tests skip when the optional (pinned, not
        # installed here) opentelemetry packages are absent, so the floor
        # is on tests actually EXECUTED (ran - skipped): other tests going
        # quiet cannot hide behind that allowance. Raise `expected` when
        # tests are added (139 run, 14 skipped today).
        run: |
          expected=125
          out=$(python3 -m unittest discover -s tools/ghg/tests -v 2>&1) || { printf '%s\n' "$out"; echo "ERROR: ghg suite failed"; exit 1; }
          printf '%s\n' "$out"
          ran=$(printf '%s\n' "$out" | sed -n 's/^Ran \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' | tail -n 1)
          if [ -z "$ran" ]; then
            echo "ERROR: could not read the test count from unittest output"
            exit 1
          fi
          skipped=$(printf '%s\n' "$out" | sed -n 's/^OK (.*skipped=\([0-9][0-9]*\).*)$/\1/p' | tail -n 1)
          executed=$((ran - ${skipped:-0}))
          if [ "$executed" -lt "$expected" ]; then
            echo "ERROR: ghg suite executed $executed tests (ran $ran, skipped ${skipped:-0}), expected at least $expected; a test was deleted, failed to load or was skipped"
            exit 1
          fi
      - name: Vendor freshness blocks (15 provenance files, no live API)
        run: python3 scripts/vendor_graph.py --root . --no-live --strict
      - name: Vendor freshness detector self-test
        run: python3 scripts/vendor_freshness.py --self-test
      - run: bash scripts/lane-coord.sh --self-test
      - run: bash scripts/boot-gate.sh --self-test --offline
      - run: bash scripts/tests/test_watchdog.sh
      - run: bash scripts/tests/test_watchdog_bin_guard.sh
      - run: bash scripts/tests/test_seed_boot_guards.sh
      - run: bash scripts/tests/test_apply_domain_blocks.sh
      - run: bash scripts/tests/test_vendor_sync.sh
      - run: bash scripts/tests/test_package_vm.sh
      - run: bash scripts/tests/test_package_oci.sh
      - run: bash scripts/tests/test_makefile.sh
      - run: bash scripts/tests/test_verify_signals.sh
      - run: bash ops/tests/test_watchdog_ops.sh
      - run: bash ops/tests/test_deploy_watchdog.sh
      - run: bash ops/tests/test_cron_boot_gate.sh
      - run: bash scripts/install-re-runtime.sh --self-test --offline
      - run: bash scripts/tests/test_install_re_runtime.sh
      - name: Installer env-scan suite (executed-check floor)
        # A deleted assertion (or a whole test block) is a pass unless
        # the executed count is asserted. The suite prints checks=N on
        # success; the floor keeps the PR #224 regressions from being
        # removed silently.
        run: |
          set +e
          out="$(bash scripts/tests/test_install_env_scan.sh)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          checks="$(printf '%s\n' "$out" | sed -n 's/^test_install_env_scan: checks=\([0-9][0-9]*\)$/\1/p' | tail -1)"
          if [ -z "$checks" ] || [ "$checks" -lt 950 ]; then
            echo "env-scan suite executed ${checks:-0} checks; floor is 950 (a removed assertion must not be green)" >&2
            exit 1
          fi

  # Bounded claim: on macOS and Windows (Git Bash) lane-coord loud-skips instead
  # of failing mid-run. --self-test exits 0 with the SKIP line (a skipped suite
  # is a pass) and an operational command exits 1 with it (a caller reading a
  # claim's exit status must never see unexecuted work as a started lane). The
  # full self-test still runs on Linux in `script-tests`; this job covers only
  # the guard on the platforms where the real uname fires it.
  lane-coord-non-linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve LF line endings on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lane-coord --self-test skips cleanly (exit 0)
        run: |
          rc=0
          out=$(bash scripts/lane-coord.sh --self-test 2>&1) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || { echo "ERROR: --self-test exited $rc, expected 0"; exit 1; }
          printf '%s\n' "$out" | grep -qF "SKIP: lane-coord requires flock/proc (Linux-only)" || { echo "ERROR: missing SKIP line"; exit 1; }
      - name: lane-coord operational command refuses (exit 1)
        run: |
          rc=0
          out=$(bash scripts/lane-coord.sh status 2>&1) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 1 ] || { echo "ERROR: status exited $rc, expected 1"; exit 1; }
          printf '%s\n' "$out" | grep -qF "SKIP: lane-coord requires flock/proc (Linux-only)" || { echo "ERROR: missing SKIP line"; exit 1; }

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
      - run: test -z "$(gofmt -l cmd internal reference/esf)"
      - run: go vet ./...
      - run: go test -v ./...
      - run: cd reference/esf && go vet ./...

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -fsSL --connect-timeout 15 --max-time 180 --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xz -C /tmp -f /tmp/gitleaks.tar.gz
      - name: Scan working tree for secrets
        # Direct run (not gitleaks-action): the action's PR range logic breaks
        # on merge commits (0-byte partial scan). A working-tree scan is
        # deterministic. .gitleaks.toml allowlists the known synthetic fixtures.
        run: /tmp/gitleaks detect --source . --verbose --exit-code 1

  vendor-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One script discovers reference/*, .github/vendor-*.sha256 and
      # PROVENANCE.md trees, asserts all three sets are equal (a new tree
      # without a manifest, or a stale manifest, fails by construction), then
      # verifies each manifest, unlisted files and broken symlinks.
      - name: Vendor integrity (completeness + per-tree hashes)
        run: python3 scripts/check_vendor_integrity.py --root .
      - name: Run vendored security-audit validator suites
        run: |
          node --test reference/security-audit-skill/skills/security-audit/validate-findings.test.cjs
          node --test reference/security-audit-skill/skills/security-audit/validate-coverage-ledger.test.cjs

  # Bounded claim: the vendored tree's own unit suite passes under the Node
  # version AEP's CI runs. No `npm install`: the suite has no runtime
  # dependencies (playwright is an upstream devDependency of the e2e render
  # only, which this command does not touch), so the tree the integrity job
  # hashes is the tree the tests run. Node 22 because 18 and 20 are past
  # end-of-life as of 2026-11; upstream's floor stays `engines: >=18`.
  vendor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Run vendored harness-profiler unit suite
        # Explicit glob: Node 22+ treats positional --test arguments as glob
        # patterns, so a bare directory argument fails with
        # "Cannot find module .../test" there. The glob yields the same
        # 4 test files (51 tests) on Node 18, 20, 22, 24 and 26. CI pins
        # Node 26, the current stable line; the wrapper's own floor stays
        # node 18+ (upstream engines).
        run: node --test reference/harness-profiler/test/*.test.js

  # Bounded claim: the adoption's own suites pass under the Node version CI
  # runs. Through Phase D they were local-only (`task-D1-report.md`, concern 4)
  # while the plan's Test Plan listed them as gates; this job makes them
  # PR-gating, so a handler or wrapper regression fails the PR instead of
  # merely failing a reviewer's terminal. Neither job is a required check on
  # `develop` yet; that is a promotion-time decision. No `npm install`: both
  # suites are dependency-free and use the pinned tree in place. Node 26
  # matches `vendor-tests` (current stable line; the wrapper floor stays
  # node 18+).
  profile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Run harness-profile handler suite
        # The four files are named explicitly, as `script-tests` names each
        # shell test, and their presence is checked first: Node 22+ treats each
        # positional `--test` argument as a glob, and a non-matching pattern is
        # silently skipped (verified on 26: a deleted gate.test.js still exited
        # 0), so the explicit list alone would shrink quietly. The runner's pass
        # count is then asserted: the list and `test -f` catch a deleted FILE,
        # never a deleted TEST inside one. Four files, 58 tests today.
        run: |
          files=(
            tools/harness-profile/gate.test.js
            tools/harness-profile/handle.test.js
            tools/harness-profile/hygiene.test.js
            tools/harness-profile/translate.test.js
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "ERROR: missing test file $f"; exit 1; }
          done
          expected=58
          out=$(node --test "${files[@]}" 2>&1) || { printf '%s\n' "$out"; echo "ERROR: harness-profile suite failed"; exit 1; }
          printf '%s\n' "$out"
          passes=$(printf '%s\n' "$out" | sed -n 's/^[^0-9]*pass \([0-9][0-9]*\)$/\1/p' | tail -n 1)
          if [ -z "$passes" ]; then
            echo "ERROR: could not read the pass count from node --test output"
            exit 1
          fi
          if [ "$passes" -ne "$expected" ]; then
            echo "ERROR: harness-profile suite ran $passes passing tests, expected $expected; a test was deleted or skipped"
            exit 1
          fi
      - name: Run profile-tree wrapper evals
        # E14/E14b/E14c: root walk from scripts/, the node floor with no node
        # on PATH (and a fake node whose `--version` fails), `--help`
        # without node, and explicit-destination handling (in-repo rejected,
        # external honored). Seven assertions; the script fails unless it actually
        # ran that many, so deleting an eval block cannot pass.
        run: bash scripts/tests/test_profile_tree.sh

  # Bounded claim: this gate proves the repo skills/ tree equals the manifest
  # generated from the repo tree immediately after the last sync copied from
  # live -- a consistency claim about the sync's own output, never a freshness
  # claim against the live tree (CI cannot see live).
  skills-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_skills_manifest.py --root skills --check

  # Bounded claim: this gate proves no file under skills/ contains the
  # craft-anything runtime's artifact names, a command-position or
  # registration-form invocation of it, or a non-negated imperative
  # instruction to invoke it. The adoption (plan v2.1, Phase 3) took the
  # protocol, not the engine; this recurring check replaces the one-time
  # grep and is lifted only as part of an authorized runtime plan.
  skills-routing-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_skills_phantom_capability.py --root skills
      # EGM drift: skill.yaml descriptions verbatim vs frontmatter, the
      # review-loop normalization table vs bundle agent frontmatter,
      # and egm-review call-site standards coverage (panel J8/J10/J16).
      - run: python3 scripts/check_egm_drift.py --root skills
      # Skills executables: wizard/template.sh is shellchecked in `shell-lint`;
      # quest_helper.js is the other executable under skills/. A syntax-only
      # parse (`node --check`) is the bounded claim: it proves the file
      # parses, not that it behaves. Node 26 matches vendor-tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Syntax-check skills JavaScript executables
        run: node --check skills/excalibur-quest/scripts/quest_helper.js
