name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes markdownlint-cli2 "**/*.md"

  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.10.0
          shellcheck scripts/*.sh
          test -z "$(shfmt -d scripts/*.sh)"

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: test -z "$(gofmt -l reference/esf)"
      - run: cd reference/esf && go vet ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  vendor-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd reference/esf && sha256sum -c ../../.github/vendor-esf.sha256
